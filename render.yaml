# Render Blueprint: database + API + website, created together from this file.
# Step-by-step guide: DEPLOYMENT.md. Values marked "sync: false" are asked for when the
# Blueprint is created (secrets and your domain) and are never stored in this repository.

databases:
  - name: amanah-db
    databaseName: amanah_giving
    user: amanah
    plan: basic-256mb
    region: frankfurt # closest Render region to Dakar
    ipAllowList: [] # reachable only from the API, not from the internet

services:
  # ---------- API (FastAPI) : https://api.<votre-domaine> ----------
  - type: web
    name: amanah-api
    runtime: python
    rootDir: backend
    plan: starter # the free plan sleeps and blocks email sending
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Brings the database schema up to date before each new version starts
    preDeployCommand: alembic upgrade head
    # --proxy-headers: behind Render's proxy, keep the visitor's IP (login throttling, audit log)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /database/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: amanah-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MASK_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: prod
      - key: LOG_LEVEL
        value: INFO
      # Pre-launch: site online, donations closed. Set to true on launch day.
      - key: DONATIONS_ENABLED
        value: "false"
      # No demo projects with invented amounts: real projects are added from the admin dashboard
      - key: MGX_IGNORE_INIT_DATA
        value: "1"
      # Website address (e.g. https://www.amanahgiving.org) and its other form (e.g. https://amanahgiving.org)
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ADMIN_IDLE_MINUTES
        value: "15"
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: SESSION_MAX_HOURS
        value: "12"
      # PayDunya (Wave / Orange Money): keys from app.paydunya.com; "test" until the live account is approved
      - key: PAYDUNYA_MODE
        value: test
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_PUBLIC_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      # https://api.<votre-domaine>/api/v1/payment/paydunya/ipn
      - key: PAYDUNYA_CALLBACK_URL
        sync: false
      # Optional: card payments (leave empty to keep them unavailable)
      - key: STRIPE_SECRET_KEY
        sync: false
      # Emails (donation confirmations, password reset)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: CNDSA - Collecte Nationale

  # ---------- Website (React) : https://www.<votre-domaine> ----------
  - type: web
    name: amanah-site
    runtime: static
    rootDir: frontend
    buildCommand: npx --yes pnpm@8.10.0 install --frozen-lockfile && npx --yes pnpm@8.10.0 run build
    staticPublishPath: dist
    routes:
      # Single-page app: every path (/projects, /admin...) is served by index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      # https://api.<votre-domaine> (read at build time: redeploy the site after changing it)
      - key: VITE_API_BASE_URL
        sync: false

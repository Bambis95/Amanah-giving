<html lang="fr">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable site (Android "Installer l'application", iPhone "Sur l'écran d'accueil"): public/manifest.json, public/sw.js -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SENJAPO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)" />
    <!-- Apply the theme before the first paint (no flash of the wrong theme).
         Same rules as next-themes: saved choice, else system preference, else light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('amanah-theme');
          var dark = saved === 'dark' ||
            ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>SENJAPO – Plateforme nationale de dons et de solidarité au Sénégal</title>
    <meta name="description" content="Faites un don en ligne par Wave, Orange Money ou carte bancaire pour des projets vérifiés au Sénégal : jeunes, Daaras, artisans, agriculteurs, femmes. Une initiative du CCES." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="CCES - Club des Créateurs et Entrepreneurs du Sénégal" />

    <meta property="og:site_name" content="SENJAPO" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SENJAPO - Une plateforme, plusieurs causes, une solidarité nationale" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:url and og:image (absolute addresses) are added at build time from VITE_SITE_URL: see vite.config.ts -->
  </head>

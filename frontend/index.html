<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)" />
    <!-- Apply the theme before the first paint (no flash of the wrong theme).
         Same rules as next-themes: saved choice, else system preference, else light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('amanah-theme');
          var dark = saved === 'dark' ||
            ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>SENJAPO - Plateforme Nationale de Collecte, de Solidarité et de Développement</title>
    <meta name="description" content="SENJAPO, plateforme nationale de collecte portée par le CCES : soutenez les jeunes, les Daaras, les artisans, les agriculteurs, les femmes et les projets communautaires à impact. Une plateforme, plusieurs causes, une solidarité nationale." />
    <meta name="author" content="CCES - Club des Créateurs et Entrepreneurs du Sénégal" />

    <meta property="og:title" content="SENJAPO - Une plateforme, plusieurs causes, une solidarité nationale" />
    <meta property="og:description" content="Plateforme Nationale de Collecte, de Solidarité et de Développement. Soutenez des campagnes vérifiées et suivez l'utilisation des fonds." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SENJAPO" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SENJAPO - Une plateforme, plusieurs causes, une solidarité nationale" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:url and og:image (absolute addresses) are added at build time from VITE_SITE_URL: see vite.config.ts -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)" />
    <!-- Apply the theme before the first paint (no flash of the wrong theme).
         Same rules as next-themes: saved choice, else system preference, else light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('amanah-theme');
          var dark = saved === 'dark' ||
            ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>CNDSA - Collecte Nationale pour le Développement du Secteur Agricole</title>
    <meta name="description" content="La Collecte Nationale pour le Développement du Secteur Agricole (CNDSA) rassemble les dons et les redistribue à des projets nationaux et régionaux : agriculture, éducation, assainissement, création d'activités." />
    <meta name="author" content="CNDSA" />

    <meta property="og:title" content="CNDSA - Collecte Nationale pour le Développement du Secteur Agricole" />
    <meta property="og:description" content="Soutenez des projets nationaux et régionaux : agriculture, éducation, assainissement, création d'activités. Chaque don compte." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CNDSA" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CNDSA - Ensemble, faisons grandir nos régions" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:url and og:image (absolute addresses) are added at build time from VITE_SITE_URL: see vite.config.ts -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

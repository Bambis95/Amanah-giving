# Site watch: every 30 minutes GitHub checks that the site and its server answer.
# When a check fails, GitHub emails the account that last changed this schedule (notification
# settings: "Actions"). Every 30 minutes stays inside the free minutes of a private repository
# (about 1,450 minutes a month out of 2,000). "Run workflow" in the Actions tab runs it by hand.
name: Surveillance du site

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site et serveur
        run: |
          # Three tries 30 s apart, so a slow start of the server is not reported as an outage
          check() {
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "$1" || true)
              if [ "$code" = "200" ]; then echo "OK   $1"; return 0; fi
              echo "Essai $attempt : $1 a répondu « $code »"
              sleep 30
            done
            echo "::error::$1 ne répond plus (dernier code : $code)"
            return 1
          }
          status=0
          check "https://senjapo.onrender.com/" || status=1
          # 503 when the database does not answer
          check "https://senjapo-api.onrender.com/health/full" || status=1
          exit $status
